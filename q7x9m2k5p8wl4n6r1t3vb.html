        @media (max-width: 900px) {

        @media (prefers-reduced-motion: reduce) { .lg-arrive { display: none; } .message, .lg-panel, .lg-bg img { animation: none; } .messages-area { scroll-behavior: auto; } }

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getFirestore, collection, addDoc, query, onSnapshot, orderBy,

        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Unified Firebase: same project as the rest of the site
        const firebaseConfig = {
            apiKey: "AIzaSyDY2KhiDrOqRTdHKB1XfEndM_q0hS6tx-0",
            authDomain: "catalystwriters-5ce43.firebaseapp.com",
            projectId: "catalystwriters-5ce43",
            storageBucket: "catalystwriters-5ce43.firebasestorage.app",
            messagingSenderId: "450537311266",
            appId: "1:450537311266:web:d0c286d8a5553eb92a0e7b",
            measurementId: "G-0P4DMW8ZZ1"
        };

        const COLLECTION = "winners-chat";

        let db, auth, userId = null;
        const localLikes = new Set(JSON.parse(localStorage.getItem('catalystChatLikes') || '[]'));
        function persistLocalLikes() {
            localStorage.setItem('catalystChatLikes', JSON.stringify([...localLikes]));
        }

        // Restore last-used name/title for convenience
        document.getElementById('username-input').value = localStorage.getItem('catalystChatName') || '';
        document.getElementById('title-input').value = localStorage.getItem('catalystChatTitle') || '';

        try {
            const existing = getApps().find(a => a.name === 'winners-lounge');
            const app = existing || initializeApp(firebaseConfig, 'winners-lounge');
            db = getFirestore(app);
            auth = getAuth(app);
            authenticateUser();
        } catch (e) {
            console.error("Firebase initialization failed:", e);
            showAuthError("Couldn't connect to the chat. Please refresh the page.");
        }

        async function authenticateUser() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Auth failed:", error);
                if (error.code === 'auth/admin-restricted-operation' || error.code === 'auth/operation-not-allowed') {
                    showAuthError("The chat isn't available right now. An administrator has been notified.");
                } else if (error.code === 'auth/network-request-failed') {
                    showAuthError("Network error — check your connection and refresh.");
                } else {
                    showAuthError("Couldn't sign you in. Please refresh the page to try again.");
                }
            }
        }

        function showAuthError(msg) {
            document.getElementById('messages-container').innerHTML =
                `<div class="loading-message" style="color: rgba(255,255,255,0.7);">${msg}</div>`;
            document.getElementById('user-id-display').textContent = 'unavailable';
            // Disable composer so users don't type into a dead form. Look up
            // by id directly — the const refs further down in this script may
            // not have been declared yet if init throws synchronously.
            const u = document.getElementById('username-input');
            const t = document.getElementById('title-input');
            const m = document.getElementById('message-input');
            const s = document.getElementById('submit-btn');
            if (u) u.disabled = true;
            if (t) t.disabled = true;
            if (m) m.disabled = true;
            if (s) { s.disabled = true; s.textContent = 'Chat unavailable'; }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                document.getElementById('user-id-display').textContent = userId.substring(0, 12) + '...';
                loadMessages();
            }
        });

        // Chat functionality
        const messagesContainer = document.getElementById('messages-container');
        const messageForm = document.getElementById('message-form');
        const usernameInput = document.getElementById('username-input');
        const titleInput = document.getElementById('title-input');
        const messageInput = document.getElementById('message-input');
        const submitBtn = document.getElementById('submit-btn');

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTimeAgo(timestamp) {
            if (!timestamp || !timestamp.toDate) return 'just now';
            const date = timestamp.toDate();
            const seconds = Math.floor((new Date() - date) / 1000);

            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days}d ago`;
        }

        // Warm ink colours for the initial avatars, picked from the name
        const AVATAR = ['#8a5a2b', '#5f7a61', '#3b6e8f', '#7a2e3a', '#a8843a', '#4b5563', '#6b4f8a', '#2f6b4f'];
        function avatarColor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVATAR[h % AVATAR.length]; }
        function dayLabel(date) {
            const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const diff = Math.round((d0 - d) / 86400000);
            if (diff === 0) return 'Today';
            if (diff === 1) return 'Yesterday';
            return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
        }

        function renderMessage(snap) {
            const data = snap.data();
            const hasLiked = localLikes.has(snap.id);
            const name = data.username || 'Anonymous';

            const messageDiv = document.createElement('article');
            messageDiv.className = 'message' + (userId && data.userId === userId ? ' mine' : '');
            messageDiv.dataset.id = snap.id;

            const safeName = escapeHtml(name);
            const safeTitle = data.title ? `<span class="message-title">${escapeHtml(data.title)}</span>` : '';
            const safeText = escapeHtml(data.message || '');
            const when = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : new Date();

            messageDiv.innerHTML = `
                <span class="message-avatar" style="--av:${avatarColor(name)}" aria-hidden="true">${escapeHtml(name.trim().charAt(0).toUpperCase() || '?')}</span>
                <div class="message-body">
                    <div class="message-header">
                        <span class="message-author">${safeName}</span>${safeTitle}
                        <time class="message-time" datetime="${when.toISOString()}" title="${when.toLocaleString('en-US')}">${formatTimeAgo(data.timestamp)}</time>
                    </div>
                    <p class="message-text">${safeText}</p>
                </div>
                <button class="like-btn ${hasLiked ? 'liked' : ''}" ${(!userId || hasLiked) ? 'disabled' : ''} aria-pressed="${hasLiked}" aria-label="Like this message">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
                    <span class="like-count">${data.likes || 0}</span>
                </button>
            `;
            return { el: messageDiv, when };
        }

        let unsubscribe = null, firstPaint = true;
        function loadMessages() {
            if (unsubscribe) unsubscribe();
            const messagesCol = collection(db, COLLECTION);
            const q = query(messagesCol, orderBy("timestamp", "desc"), limit(100));

            unsubscribe = onSnapshot(q, (snapshot) => {
                // keep the reader's place: stick to the bottom if they were there, otherwise hold position
                const fromBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
                const atBottom = firstPaint || fromBottom < 80;
                const keepTop = messagesContainer.scrollTop;
                messagesContainer.innerHTML = '';

                if (snapshot.empty) {
                    messagesContainer.innerHTML = '<div class="loading-message">Be the first winner to leave a note.</div>';
                    return;
                }

                // oldest at the top, newest by the composer, with a divider for each day
                const docs = []; snapshot.forEach(d => docs.push(d)); docs.reverse();
                let lastDay = '';
                docs.forEach(d => {
                    const { el, when } = renderMessage(d);
                    const label = dayLabel(when);
                    if (label !== lastDay) {
                        const sep = document.createElement('div');
                        sep.className = 'day-sep'; sep.innerHTML = `<span>${label}</span>`;
                        messagesContainer.appendChild(sep); lastDay = label;
                    }
                    messagesContainer.appendChild(el);
                });

                messagesContainer.style.scrollBehavior = 'auto';          // restore instantly, no glide
                if (atBottom) messagesContainer.scrollTop = messagesContainer.scrollHeight;
                else messagesContainer.scrollTop = keepTop;
                messagesContainer.style.scrollBehavior = '';
                firstPaint = false;
            }, (err) => {
                console.error('Snapshot error:', err);
                messagesContainer.innerHTML = '<div class="loading-message">Lost connection. Refresh to reconnect.</div>';
            });
        }

        // the composer: grows with the text, Enter sends, Shift+Enter adds a line
        const countEl = document.getElementById('lg-count');
        function fitComposer() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
            const n = messageInput.value.length;
            countEl.textContent = `${n} / 500`;
            countEl.classList.toggle('near', n > 440);
        }
        messageInput.addEventListener('input', fitComposer);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); messageForm.requestSubmit(); }
        });

        messagesContainer.addEventListener('click', async (e) => {
            const likeBtn = e.target.closest('.like-btn');
            if (!likeBtn) return;
            const messageEl = likeBtn.closest('.message');
            if (!messageEl) return;

            const docId = messageEl.dataset.id;
            if (!userId || localLikes.has(docId) || likeBtn.disabled) return;

            // Optimistic UI: lock the button immediately
            localLikes.add(docId);
            persistLocalLikes();
            likeBtn.classList.add('liked');
            likeBtn.disabled = true;
            likeBtn.setAttribute('aria-pressed', 'true');
            const countEl = likeBtn.querySelector('.like-count');
            if (countEl) countEl.textContent = String(parseInt(countEl.textContent || '0', 10) + 1);

            try {
                // Atomic batch: write the per-user like record + increment counter together
                const likeRef = doc(db, 'chat-likes', `${docId}_${userId}`);
                const docRef = doc(db, COLLECTION, docId);
                const batch = writeBatch(db);
                batch.set(likeRef, { messageId: docId, userId, at: serverTimestamp() });
                batch.update(docRef, { likes: increment(1) });
                await batch.commit();
            } catch (error) {
                console.error("Error liking:", error);
                // Likely already liked at the server — keep the visual state
            }
        });

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userId) return;

            const username = usernameInput.value.trim();
            const title = titleInput.value.trim();
            const message = messageInput.value.trim();

            if (!username) { const chip = usernameInput.closest('.lg-chip'); chip.classList.remove('need'); void chip.offsetWidth; chip.classList.add('need'); usernameInput.focus(); return; }
            if (!message) { messageInput.focus(); return; }

            if (username.length > 50) { alert('Name must be 50 characters or less'); return; }
            if (message.length > 500) { alert('Message must be 500 characters or less'); return; }
            if (title && title.length > 30) { alert('Title must be 30 characters or less'); return; }

            submitBtn.disabled = true;
            submitBtn.classList.add('sending');

            try {
                await addDoc(collection(db, COLLECTION), {
                    username,
                    title: title || null,
                    message,
                    timestamp: serverTimestamp(),
                    userId,
                    likes: 0
                });

                localStorage.setItem('catalystChatName', username);
                localStorage.setItem('catalystChatTitle', title);
                messageInput.value = '';
                fitComposer();
                messageInput.focus();
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (error) {
                console.error("Error sending message:", error);
                if (error.code === 'permission-denied') {
                    alert('Please wait a few minutes between messages.');
                } else {
                    alert('Error sending message. Please try again.');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('sending');
            }
        });
    </script>
</body>
</html>
